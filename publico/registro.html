<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body p-4 p-md-5">
                        
                        <h2 class="text-center mb-4">Registro de Usuario</h2>
                        
                        <form id="form-registro">
                        
                            <!--RUT-->
                            <div class="mb-3">
                                <label for="run-registro" class="form-label">RUN (Sin puntos ni guion)</label>
                                <input type="text" class="form-control" id="run-registro" placeholder="123456789">
                                <div id="error-run" class="text-danger small mt-1 d-none"></div>
                            </div>

                            <!--Nombre y apellido-->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="nombre-registro" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombre-registro">
                                    <div id="error-nombre" class="text-danger small mt-1 d-none"></div>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <label for="apellido-registro" class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" id="apellido-registro">
                                    <div id="error-apellido" class="text-danger small mt-1 d-none"></div>
                                </div>
                            </div>

                            <!--Correo y fecha de nacimiento-->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="email-registro" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="email-registro">
                                    <div id="error-email" class="text-danger small mt-1 d-none"></div>
                                </div>
                                <div class="col-md-6 mt-3 mt-md-0">
                                    <label for="fecha-registro" class="form-label">Fecha de Nacimiento (Opcional)</label>
                                    <input type="date" class="form-control" id="fecha-registro">
                                </div>
                            </div>

                            <!-- Tipo de usuario -->
                            <div class="mb-3">
                                <label for="tipo-registro" class="form-label">Tipo de Usuario</label>
                                <select class="form-select" id="tipo-registro">
                                    <option value="">Seleccione un perfil...</option>
                                    <option value="cliente">Cliente</option>
                                    <option value="administrador">Administrador</option>
                                </select>
                                <div id="error-tipo" class="text-danger small mt-1 d-none"></div>
                            </div>

                            <!--Región y comuna-->
                            <div class="mb-3">
                                <label for="region-registro" class="form-label">Región</label>
                                <select class="form-select" id="region-registro">
                                    <option value="">Seleccione una región...</option>
                                    <!-- JavaScript llenará esto -->
                                </select>
                                <div id="error-region" class="text-danger small mt-1 d-none"></div>
                            </div>

                            <div class="mb-3">
                                <label for="comuna-registro" class="form-label">Comuna</label>
                                <select class="form-select" id="comuna-registro" disabled>
                                    <option value="">Seleccione una comuna...</option>
                                    <!-- JavaScript llenará esto al cambiar la región -->
                                </select>
                                <div id="error-comuna" class="text-danger small mt-1 d-none"></div>
                            </div>

                            <!-- Dirección -->
                            <div class="mb-4">
                                <label for="direccion-registro" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion-registro">
                                <div id="error-direccion" class="text-danger small mt-1 d-none"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Crear Cuenta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>


    <!-- Al final de tu registro.html -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script> <!-- Carga las funciones globales primero -->
    <script src="../js/registro.js"></script>

</body>
</html>
