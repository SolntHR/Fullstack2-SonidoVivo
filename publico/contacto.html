<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Sonido Vivo</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Css-->
    <link rel="stylesheet" href="../css/general.css">
</head>
<body>
    <!-- Menú de Navegación -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">Sonido Vivo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="catalogo_general.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                        <li class="nav-item"><a class="nav-link" href="novedades.html">Novedades</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
                    </ul>
                    <!-- Carrito -->
                    <button class="btn btn-outline-light ms-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#panelCarrito">
                        Carrito (<span id="contador-carrito">0</span>)
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Formulario de Contacto -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4">Ponte en contacto</h2>
                        <p class="text-center text-muted mb-4">¿Tienes dudas sobre un equipo o necesitas asesoría? Escríbenos y te responderemos a la brevedad.</p>
                        
                        <form id="form-contacto">
                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre-contacto" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre-contacto" placeholder="Tu nombre">
                                <div id="error-nombre" class="text-danger small mt-1 d-none"></div>
                            </div>
                            
                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="correo-contacto" class="form-label">Correo electrónico</label>
                                <input type="text" class="form-control" id="correo-contacto" placeholder="correo@ejemplo.com">
                                <div id="error-correo" class="text-danger small mt-1 d-none"></div>
                            </div>
                            
                            <!-- Comentario -->
                            <div class="mb-4">
                                <label for="mensaje-contacto" class="form-label">Mensaje o comentario</label>
                                <textarea class="form-control" id="mensaje-contacto" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                                <div id="error-mensaje" class="text-danger small mt-1 d-none"></div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Enviar Mensaje</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 Tienda Sonido Vivo.</p>
        </div>
    </footer>

    <!-- Offcanvas del carrito (Debe ir en todas las páginas que tengan el botón) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="panelCarrito">
        <div class="offcanvas-header bg-light">
            <h5 class="offcanvas-title">Tu Selección</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <ul id="lista-carrito" class="list-group mb-3 flex-grow-1"></ul>
            <div class="mt-auto border-top pt-3">
                <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                    <span>Total:</span>
                    <span id="total-carrito">$0</span>
                </div>
                <button class="btn btn-success w-100">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- Scripts en orden -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/catalogo.js"></script>
    <script src="../js/contacto.js"></script>
</body>
</html>
