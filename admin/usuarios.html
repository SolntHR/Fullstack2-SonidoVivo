<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Sonido Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/general.css">
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid px-4">
                <a class="navbar-brand text-warning fw-bold" href="index_admin.html">Admin Sonido Vivo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuAdmin">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="mantenedor.html">Mantenedor de Productos</a></li>
                        <li class="nav-item"><a class="nav-link active" href="usuarios.html">Mantenedor de Usuarios</a></li>
                        <li class="nav-item"><a class="nav-link" href="../publico/login.html">Cerrar Sesión</a></li>
            </div>
        </nav>
    </header>

    <main class="container-fluid px-4 my-5">
        <div class="row">
            
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0" id="titulo-form-usuario">Agregar Nuevo Usuario</h5>
                    </div>
                    <div class="card-body">
                        <form id="form-usuarios">
                            <div class="mb-3">
                                <label for="user-rut" class="form-label">RUT (Sin puntos, con guion)</label>
                                <input type="text" class="form-control" id="user-rut" placeholder="12345678-9">
                            </div>
                            
                            <div class="mb-3">
                                <label for="user-nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="user-nombre">
                            </div>

                            <div class="mb-3">
                                <label for="user-correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="user-correo">
                            </div>
                            
                            <div class="mb-3" id="contenedor-user-password">
                                <label for="user-password" class="form-label">Contraseña Inicial</label>
                                <input type="password" class="form-control" id="user-password" placeholder="Mínimo 4 caracteres">
                            </div>

                            <div class="mb-4">
                                <label for="user-rol" class="form-label">Rol del Usuario</label>
                                <select class="form-select" id="user-rol">
                                    <option value="">Seleccionar...</option>
                                    <option value="Cliente">Cliente</option>
                                    <option value="Administrador">Administrador</option>
                                </select>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" id="btn-guardar-user">Guardar Usuario</button>
                                <button type="button" class="btn btn-secondary" id="btn-limpiar-user">Limpiar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold">Usuarios Registrados</h5>
                        <span class="badge bg-dark" id="contador-usuarios">0 usuarios</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                            <table class="table table-hover table-striped align-middle mb-0">
                                <thead class="table-dark sticky-top">
                                    <tr>
                                        <th>RUT</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Rol</th>
                                        <th class="text-center">Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-usuarios-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/admin_usuarios.js"></script>

</body>
</html>
