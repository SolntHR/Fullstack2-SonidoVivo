<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Sonido Vivo</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Css-->
    <link rel="stylesheet" href="../css/general.css">
</head>
<body class="bg-light">

    <!-- Navbar Administrativo -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid px-4">
                <a class="navbar-brand text-warning fw-bold" href="index_admin.html">Admin Sonido Vivo</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuAdmin">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuAdmin">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="mantenedor.html">Mantenedor de Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="mantenedor_usuarios.html">Mantenedor de Usuarios</a></li>
                        <li class="nav-item"><a class="nav-link" href="../publico/login.html">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-fluid px-4 my-5">
        <div class="row">
            
            <!-- Formulario Agregar / Modificar / Eliminar -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="card-title mb-0" id="titulo-formulario">Agregar Nuevo Producto</h5>
                    </div>
                    <div class="card-body">
                        <form id="form-mantenedor">
                            <div class="mb-3">
                                <label for="admin-codigo" class="form-label">Código</label>
                                <input type="text" class="form-control" id="admin-codigo" placeholder="Ej: GA001">
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="admin-categoria" class="form-label">Categoría</label>
                                    <select class="form-select" id="admin-categoria">
                                        <option value="">Seleccionar...</option>
                                        <option value="Guitarras Acusticas">Guitarras Acústicas</option>
                                        <option value="Guitarras Electricas">Guitarras Eléctricas</option>
                                        <option value="Bajos Electricos">Bajos Eléctricos</option>
                                        <option value="Baterías">Baterías</option>
                                        <option value="Teclados y Pianos">Teclados y Pianos</option>
                                        <option value="Amplificadores">Amplificadores</option>
                                        <option value="Microfonos">Microfonos</option>
                                        <option value="Pedales de Efectos">Pedales de Efectos</option>
                                        <option value="Accesorios">Accesorios</option>
                                        <option value="Estudio y Grabacion">Estudio y Grabación</option>
                                        
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="admin-marca" class="form-label">Marca</label>
                                    <input type="text" class="form-control" id="admin-marca">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="admin-modelo" class="form-label">Modelo</label>
                                <input type="text" class="form-control" id="admin-modelo">
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="admin-precio" class="form-label">Precio ($)</label>
                                    <input type="number" class="form-control" id="admin-precio" min="0">
                                </div>
                                <div class="col-6">
                                    <label for="admin-stock" class="form-label">Stock</label>
                                    <input type="number" class="form-control" id="admin-stock" min="0">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="admin-descripcion" class="form-label">Descripción Breve</label>
                                <textarea class="form-control" id="admin-descripcion" rows="3"></textarea>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success" id="btn-guardar">Guardar Producto</button>
                                <button type="button" class="btn btn-secondary" id="btn-limpiar">Limpiar Formulario</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla del Catálogo -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold">Inventario Actual</h5>
                        <span class="badge bg-primary" id="contador-inventario">0 productos</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                            <table class="table table-hover table-striped align-middle mb-0">
                                <thead class="table-dark sticky-top">
                                    <tr>
                                        <th>Código</th>
                                        <th>Categoría</th>
                                        <th>Marca/Modelo</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-productos">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>

</body>
</html>
